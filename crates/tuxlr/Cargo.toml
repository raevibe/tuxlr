[package]
name = "tuxlr"
description = "A standalone Linux desktop app for the TC-Helicon GoXLR and GoXLR Mini"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["TuxLR contributors"]

[[bin]]
name = "tuxlr"
path = "src/main.rs"

[dependencies]
tuxlr-engine = { path = "../tuxlr-engine" }
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
strum = { workspace = true }
enum-map = { workspace = true }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { workspace = true, features = ["png"] }
